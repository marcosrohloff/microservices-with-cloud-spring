services:
  zipkin-server:
    image: openzipkin/zipkin:3.5.1
    ports:
      - "9411:9411"
    restart: unless-stopped
    networks:
      - erudio-network

  naming-server:
    image: marcosfersh/naming-server:0.0.1-SNAPSHOT
    ports:
      - "8761:8761"
    restart: unless-stopped
    depends_on:
      - zipkin-server
    networks:
      - erudio-network

  api-gateway:
    image: marcosfersh/api-gateway:0.0.1-SNAPSHOT
    ports:
      - "8765:8765"
    restart: unless-stopped
    depends_on:
      - zipkin-server
      - naming-server
    environment:
      SPRING_ZIPKIN_BASE_URL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
    networks:
      - erudio-network

  exchange-service:
    image: marcosfersh/exchange-service:0.0.1-SNAPSHOT
    build:
      context: ./exchange-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - zipkin-server
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Sao_Paulo
      SPRING_ZIPKIN_BASE_URL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/exchange_service?useTimezone=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    networks:
      - erudio-network

  book-service:
    image: marcosfersh/book-service:0.0.1-SNAPSHOT
    build:
      context: ./book-service
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - zipkin-server
      - naming-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Sao_Paulo
      SPRING_ZIPKIN_BASE_URL: http://zipkin-server:9411
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://naming-server:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/book_service?useTimezone=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8100:8100"
    networks:
      - erudio-network

networks:
  erudio-network:
    name: erudio-network
    driver: bridge
